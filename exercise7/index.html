<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Exercise 7 - Cards Columns</title>

    <!-- Bootstrap 5 CSS CDN -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <style>
      /* Bo viền dày dặn bao quanh toàn bộ Card giống ảnh mẫu */
      .card-custom-blue {
        border: 8px solid #2563eb !important;
      }
      .card-custom-yellow {
        border: 8px solid #eab308 !important;
      }
      .card-custom-red {
        border: 8px solid #b91c1c !important;
      }

      /* Chiều cao đồng đều cho ảnh xe */
      .card-img-car {
        height: 220px;
        object-fit: contain;
        background-color: #ffffff;
        padding: 10px;
      }
    </style>
  </head>
  <body class="p-4 bg-white">
    <div class="container-fluid">
      <!-- Tiêu đề đề bài -->
      <h1 class="fw-bold mb-4" style="font-size: 32px">Cards Columns</h1>

      <!-- Hàng lưới chứa 3 card -->
      <div class="row g-4">
        <!-- Card 1: Màu xanh dương (Primary) -->
        <div class="col-md-4">
          <div
            class="card card-custom-blue h-100 rounded-0 overflow-hidden shadow-sm"
          >
            <img
              src="https://mercedes-automobile.vn/wp-content/uploads/sites/204/2022/10/Mercedes-Maybach-S680-1.png"
              class="card-img-top card-img-car"
              alt="Mercedes Maybach S680"
            />
            <div class="card-body bg-primary text-white text-center py-2">
              <p class="card-text mb-0 fs-5">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <!-- Card 2: Màu vàng cam (Warning) -->
        <div class="col-md-4">
          <div
            class="card card-custom-yellow h-100 rounded-0 overflow-hidden shadow-sm"
          >
            <img
              src="https://mercedes-car.com.vn/wp-content/uploads/2023/02/mercedes-maybach-gls-480-4matic_0030_120223.jpg"
              class="card-img-top card-img-car"
              alt="Mer GLS480 4MATIC"
            />
            <div class="card-body bg-warning text-dark text-center py-2">
              <p class="card-text mb-0 fs-5">Some text inside the first card</p>
            </div>
          </div>
        </div>

        <!-- Card 3: Màu đỏ (Danger) -->
        <div class="col-md-4">
          <div
            class="card card-custom-red h-100 rounded-0 overflow-hidden shadow-sm"
          >
            <img
              src="https://porsche-vietnam.vn/wp-content/uploads/2024/09/972-g3-gts-modelimage-sideshot-840x473.png"
              class="card-img-top card-img-car"
              alt="Porsche Panamera"
            />
            <div
              class="card-body bg-danger text-white text-center py-2"
              style="background-color: #b91c1c !important"
            >
              <p class="card-text mb-0 fs-5">Some text inside the first card</p>
            </div>
          </div>
        </div>
      </div>
    </div>

    <!-- Bootstrap 5 Bundle JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
